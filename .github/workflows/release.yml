name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches VERSION / rivet.rktd / updater and CHANGELOG
        run: |
          bash scripts/check-release-version.sh "${{ github.ref_name }}"
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "^## $TAG" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $TAG' section"; exit 1; }

  macos:
    name: macOS package (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            racket-arch: arm64
          - arch: x64
            runner: macos-15-intel
            racket-arch: x64
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Rivet
        uses: actions/checkout@v4
        with:
          repository: turinglambdaai/rivet
          path: rivet
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ matrix.racket-arch }}
          version: stable
          distribution: full
      - name: Install crypto package (rivet/distribution dependency)
        run: raco pkg install --auto --no-docs crypto
        shell: bash
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet/rivet" "$GITHUB_WORKSPACE/rivet/rivet-cli"
      - name: Version preflight (VERSION == rivet.rktd == updater)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Package
        run: raco rivet package
      - name: Zip + DMG (drag to Applications)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          # ship as Payback.app regardless of how raco rivet package named it;
          # the updater's install target is /Applications/Payback.app
          mv dist/payback.app dist/Payback.app
          # portable zip: human asset, not a feed entry (the feed carries the
          # DMG — the macOS update flow mounts and copies from it)
          ( cd dist && zip -qry "../payback-${VERSION}-macos-${ARCH}.zip" Payback.app )
          brew install create-dmg
          sh scripts/make-dmg.sh dist "payback-${VERSION}-macos-${ARCH}.dmg" Payback
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            payback-*-macos-*.dmg
            payback-*-macos-*.zip
          if-no-files-found: error

  windows:
    name: Windows package (x64)
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Rivet
        uses: actions/checkout@v4
        with:
          repository: turinglambdaai/rivet
          path: rivet
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          version: stable
          distribution: full
      - name: Install crypto package (rivet/distribution dependency)
        run: raco pkg install --auto --no-docs crypto
        shell: bash
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet/rivet" "$GITHUB_WORKSPACE/rivet/rivet-cli"
        shell: bash
      - name: Install WiX (v5; v7 requires EULA acceptance, v5 runs the v4 schema)
        run: dotnet tool install --global wix --version 5.0.2
        shell: bash
      - name: Version preflight (VERSION == rivet.rktd == updater)
        shell: bash
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Package + MSI (rivet release, development signing)
        env:
          RIVET_UPDATE_BASE_URL: https://github.com/turinglambdaai/payback/releases/download/${{ github.ref_name }}
          RIVET_UPDATE_KEY_ID: payback-2026-09
          RIVET_UPDATE_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          KEY_DER="$(mktemp -d)/update-ed25519-private.der"
          printf '%s' "$RIVET_UPDATE_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          export RIVET_UPDATE_PRIVATE_KEY="$KEY_DER"
          raco rivet release --development
          rm -f "$KEY_DER"
        shell: bash
      - name: Collect MSI
        run: |
          # payback signs one merged feed in the publish job; the per-platform
          # channel manifest rivet emits here is not shipped.
          rm -f dist/update-*.json
          mv dist/*.msi "payback-${GITHUB_REF_NAME#v}-windows-x64.msi"
        shell: bash
      - name: Portable zip (human asset, not a feed entry)
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Compress-Archive -Path 'dist\payback-windows-x64' -DestinationPath "payback-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            payback-*-windows-x64.msi
            payback-*-windows-x64.zip
          if-no-files-found: error

  linux:
    name: Linux tar.gz
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Rivet
        uses: actions/checkout@v4
        with:
          repository: turinglambdaai/rivet
          path: rivet
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install crypto package (rivet/distribution dependency)
        run: raco pkg install --auto --no-docs crypto
        shell: bash
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet/rivet" "$GITHUB_WORKSPACE/rivet/rivet-cli"
      - name: Install GTK toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libgtk-4-dev libjson-glib-dev libsecret-1-dev libglib2.0-dev
      - name: Cache embeddable Racket CS
        id: cache-racket-embed
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/racket-embed
          key: racket-embed-9.3-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build embeddable Racket CS
        if: steps.cache-racket-embed.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/racket-minimal-9.3-src-builtpkgs.tgz"
          source_root="$RUNNER_TEMP/racket-9.3"
          build_root="$RUNNER_TEMP/racket-embed-build"
          embed_prefix="$RUNNER_TEMP/racket-embed"
          curl --fail --location --retry 3 --output "$archive" \
            https://download.racket-lang.org/releases/9.3/installers/racket-minimal-9.3-src-builtpkgs.tgz
          echo "3a01324d559a15e3f1f58b0c57a92bb344dce534e72e564e0d8b75e3b9c65295  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          mkdir -p "$build_root"
          cd "$build_root"
          "$source_root/src/configure" --prefix="$embed_prefix"
          make -j2
          make install
      - name: Save embeddable Racket CS cache
        if: steps.cache-racket-embed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/racket-embed
          key: racket-embed-9.3-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Expose embeddable runtime paths
        shell: bash
        run: |
          set -euo pipefail
          embed_prefix="$RUNNER_TEMP/racket-embed"
          racket_include="$(racket -e '(require setup/dirs) (display (path->string (find-include-dir)))')"
          petite="$(find "$embed_prefix" -maxdepth 6 -name petite.boot -print -quit)"
          scheme="$(find "$embed_prefix" -maxdepth 6 -name scheme.boot -print -quit)"
          racket_boot="$(find "$embed_prefix" -maxdepth 6 -name racket.boot -print -quit)"
          test -n "$petite" && test -n "$scheme" && test -n "$racket_boot"
          library="$(find "$embed_prefix" -maxdepth 6 -name 'libracketcs*.a' -print -quit)"
          test -n "$library"
          echo "RIVET_RACKET_INCLUDE=$racket_include" >> "$GITHUB_ENV"
          echo "RIVET_RACKET_LIB_DIR=$(dirname "$library")" >> "$GITHUB_ENV"
          echo "RIVET_RACKET_LIBRARY=$library" >> "$GITHUB_ENV"
          echo "RIVET_RACKET_BOOT_DIR=$(dirname "$petite")" >> "$GITHUB_ENV"
      - name: Version preflight (VERSION == rivet.rktd == updater)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Package (rivet release, development signing)
        env:
          RIVET_UPDATE_BASE_URL: https://github.com/turinglambdaai/payback/releases/download/${{ github.ref_name }}
          RIVET_UPDATE_KEY_ID: payback-2026-09
          RIVET_UPDATE_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          KEY_DER="$(mktemp -d)/update-ed25519-private.der"
          printf '%s' "$RIVET_UPDATE_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          export RIVET_UPDATE_PRIVATE_KEY="$KEY_DER"
          raco rivet release --development
          rm -f "$KEY_DER"
        shell: bash
      - name: Collect tar.gz
        run: |
          # payback signs one merged feed in the publish job; the per-platform
          # channel manifest rivet emits here is not shipped.
          rm -f dist/update-*.json
          mv dist/payback-*-linux-*.tar.gz "payback-${GITHUB_REF_NAME#v}-linux-x64.tar.gz"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: payback-*-linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: Sign manifest + publish
    needs: [macos, windows, linux]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Rivet
        uses: actions/checkout@v4
        with:
          repository: turinglambdaai/rivet
          path: rivet
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: arm64
          version: stable
          distribution: full
      - name: Install crypto package (rivet/distribution dependency)
        run: raco pkg install --auto --no-docs crypto
        shell: bash
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet/rivet" "$GITHUB_WORKSPACE/rivet/rivet-cli"
      - name: Version preflight (VERSION == rivet.rktd == updater)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Flatten artifact dirs
        run: |
          find dist -mindepth 2 -maxdepth 2 -type f -exec mv {} dist/ \;
          find dist -mindepth 1 -maxdepth 1 -type d -empty -delete
          ls -la dist/
      - name: Generate + sign update manifest
        env:
          UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          KEY_DER="$(mktemp -d)/update-ed25519-private.der"
          printf '%s' "$UPDATE_ED25519_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          bash scripts/make-update-manifest.sh "${{ github.ref_name }}" dist "$KEY_DER"
          rm -f "$KEY_DER"
      - name: Verify SHA256SUMS
        run: |
          cd dist
          shasum -a 256 --check SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" -R turinglambdaai/payback >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/* --clobber -R turinglambdaai/payback
          else
            gh release create "${{ github.ref_name }}" dist/* \
              -R turinglambdaai/payback \
              --title "Payback ${{ github.ref_name }}" \
              --generate-notes
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*
