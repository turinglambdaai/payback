name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches VERSION / rivet.rktd / updater and CHANGELOG
        run: |
          bash scripts/check-release-version.sh "${{ github.ref_name }}"
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "^## $TAG" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $TAG' section"; exit 1; }

  macos:
    name: macOS package (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            racket-arch: arm64
          - arch: x64
            runner: macos-15-intel
            racket-arch: x64
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Rivet
        uses: actions/checkout@v4
        with:
          repository: turinglambdaai/rivet
          path: rivet
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ matrix.racket-arch }}
          version: stable
          distribution: full
      - name: Install crypto package (rivet/distribution dependency)
        run: raco pkg install --auto --no-docs crypto
        shell: bash
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet/rivet" "$GITHUB_WORKSPACE/rivet/rivet-cli"
      - name: Version preflight (VERSION == rivet.rktd == updater)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Package
        run: raco rivet package
      - name: Zip + DMG (drag to Applications)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          # ship as Payback.app regardless of how raco rivet package named it;
          # the updater's install target is /Applications/Payback.app
          mv dist/payback.app dist/Payback.app
          # portable zip: human asset, not a feed entry (the feed carries the
          # DMG — the macOS update flow mounts and copies from it)
          ( cd dist && zip -qry "../payback-${VERSION}-macos-${ARCH}.zip" Payback.app )
          brew install create-dmg
          sh scripts/make-dmg.sh dist "payback-${VERSION}-macos-${ARCH}.dmg" Payback
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            payback-*-macos-*.dmg
            payback-*-macos-*.zip
          if-no-files-found: error

  windows:
    name: Windows package (x64)
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Rivet
        uses: actions/checkout@v4
        with:
          repository: turinglambdaai/rivet
          path: rivet
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          version: stable
          distribution: full
      - name: Install crypto package (rivet/distribution dependency)
        run: raco pkg install --auto --no-docs crypto
        shell: bash
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet/rivet" "$GITHUB_WORKSPACE/rivet/rivet-cli"
        shell: bash
      - name: Install WiX (v5; v7 requires EULA acceptance, v5 runs the v4 schema)
        run: dotnet tool install --global wix --version 5.0.2
        shell: bash
      - name: Version preflight (VERSION == rivet.rktd == updater)
        shell: bash
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Package + MSI (rivet release, development signing)
        env:
          RIVET_UPDATE_BASE_URL: https://github.com/turinglambdaai/payback/releases/download/${{ github.ref_name }}
          RIVET_UPDATE_KEY_ID: payback-2026-09
          RIVET_UPDATE_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          KEY_DER="$(mktemp -d)/update-ed25519-private.der"
          printf '%s' "$RIVET_UPDATE_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          export RIVET_UPDATE_PRIVATE_KEY="$KEY_DER"
          raco rivet release --development
          rm -f "$KEY_DER"
        shell: bash
      - name: Collect MSI
        run: |
          # payback signs one merged feed in the publish job; the per-platform
          # channel manifest rivet emits here is not shipped.
          rm -f dist/update-*.json
          mv dist/*.msi "payback-${GITHUB_REF_NAME#v}-windows-x64.msi"
        shell: bash
      - name: Portable zip (human asset, not a feed entry)
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Compress-Archive -Path 'dist\payback-windows-x64' -DestinationPath "payback-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            payback-*-windows-x64.msi
            payback-*-windows-x64.zip
          if-no-files-found: error

  linux:
    name: Linux package (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      # appimagetool runs in extract-and-run mode on the runner (no FUSE);
      # rivet sets this itself before invoking the tool — declared here so
      # the build machine contract is visible in the workflow (taskly form).
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Rivet
        uses: actions/checkout@v4
        with:
          repository: turinglambdaai/rivet
          path: rivet
      - name: Set up embeddable Racket CS
        uses: turinglambdaai/rivet/.github/actions/setup-embed-racket@main
      - name: Install crypto package (rivet/distribution dependency)
        run: raco pkg install --auto --no-docs crypto
        shell: bash
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet/rivet" "$GITHUB_WORKSPACE/rivet/rivet-cli"
      - name: Install GTK toolchain + packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config file \
            desktop-file-utils rpm \
            libgtk-4-dev libjson-glib-dev libsecret-1-dev libglib2.0-dev
      - name: Version preflight (VERSION == rivet.rktd == updater)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Package (rivet release, development signing)
        env:
          RIVET_UPDATE_BASE_URL: https://github.com/turinglambdaai/payback/releases/download/${{ github.ref_name }}
          RIVET_UPDATE_KEY_ID: payback-2026-09
          RIVET_UPDATE_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          KEY_DER="$(mktemp -d)/update-ed25519-private.der"
          printf '%s' "$RIVET_UPDATE_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          export RIVET_UPDATE_PRIVATE_KEY="$KEY_DER"
          raco rivet release --development
          rm -f "$KEY_DER"
        shell: bash
      - name: Collect artifacts + sha256 sidecars
        run: |
          set -euo pipefail
          # payback signs one merged feed in the publish job; the per-platform
          # channel manifest rivet emits here is not shipped. SBOM/notices are
          # a taskly release artifact, not a payback one.
          rm -f dist/update-*.json dist/sbom.cdx.json dist/THIRD_PARTY_NOTICES.txt
          # Family naming audit: rivet emits these exact names — the tar.gz
          # carries the update feed's x64/arm64 arch, deb the Debian arch,
          # rpm the toolchain arch plus the build number, AppImage the
          # toolchain arch.
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          case "$ARCH" in
            x64)   DEB_ARCH=amd64;   RPM_ARCH=x86_64;  AAI_ARCH=x86_64 ;;
            arm64) DEB_ARCH=arm64;   RPM_ARCH=aarch64; AAI_ARCH=aarch64 ;;
            *) echo "unknown matrix arch: $ARCH" >&2; exit 1 ;;
          esac
          test -f "dist/payback-${VERSION}-linux-${ARCH}.tar.gz"
          test -f "dist/payback-${VERSION}-linux-${DEB_ARCH}.deb"
          # the rpm name carries the rivet.rktd build number — assert by
          # glob so a build bump needs no workflow edit
          ls dist/payback-${VERSION}-*-linux-${RPM_ARCH}.rpm >/dev/null
          test -f "dist/payback-${VERSION}-linux-${AAI_ARCH}.AppImage"
          test -f "dist/payback-${VERSION}-linux-${ARCH}.zip"
          # sha256 sidecar for every shipped artifact (rivet already writes
          # one beside the portable zip). dist also holds the staged
          # payback-linux-<arch>/ package directory — files only.
          cd dist
          for f in payback-*; do
            case "$f" in
              *.sha256) ;;
              *) [ -f "$f" ] || continue
                 [ -f "$f.sha256" ] || sha256sum "$f" > "$f.sha256" ;;
            esac
          done
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/payback-*.tar.gz
            dist/payback-*.deb
            dist/payback-*.rpm
            dist/payback-*.AppImage
            dist/payback-*.zip
            dist/payback-*.sha256
          if-no-files-found: error

  release:
    name: Sign manifest + publish
    needs: [macos, windows, linux]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Rivet
        uses: actions/checkout@v4
        with:
          repository: turinglambdaai/rivet
          path: rivet
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: arm64
          version: stable
          distribution: full
      - name: Install crypto package (rivet/distribution dependency)
        run: raco pkg install --auto --no-docs crypto
        shell: bash
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet/rivet" "$GITHUB_WORKSPACE/rivet/rivet-cli"
      - name: Version preflight (VERSION == rivet.rktd == updater)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Flatten artifact dirs
        run: |
          find dist -mindepth 2 -maxdepth 2 -type f -exec mv {} dist/ \;
          find dist -mindepth 1 -maxdepth 1 -type d -empty -delete
          ls -la dist/
      - name: Generate + sign update manifest
        env:
          UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          KEY_DER="$(mktemp -d)/update-ed25519-private.der"
          printf '%s' "$UPDATE_ED25519_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          bash scripts/make-update-manifest.sh "${{ github.ref_name }}" dist "$KEY_DER"
          rm -f "$KEY_DER"
      - name: Verify SHA256SUMS
        run: |
          cd dist
          shasum -a 256 --check SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" -R turinglambdaai/payback >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/* --clobber -R turinglambdaai/payback
          else
            gh release create "${{ github.ref_name }}" dist/* \
              -R turinglambdaai/payback \
              --title "Payback ${{ github.ref_name }}" \
              --generate-notes
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*
