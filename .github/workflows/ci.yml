name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Single source of truth for the rivet pin; every install step below
# references this so a bump is one edit, not a grep-replace across jobs.
env:
  RIVET_PIN: 5b1f3466a6030592d63cec2d7f17f33ac9e1a76a
jobs:
  backend:
    name: Racket backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          path: payback
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.16
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}'
        shell: bash
      - name: Test backend
        working-directory: payback
        run: raco test tests/
        shell: bash

  strings:
    name: Contract preflight (i18n + release metadata)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify generated string tables
        run: node scripts/gen-strings.js --check
      - name: Verify release version alignment (VERSION == rivet.rktd == updater)
        run: bash scripts/check-release-version.sh

  linux-host:
    name: Linux host (GTK4 build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: payback
      - name: Set up embeddable Racket CS
        # Literal pin: `uses:` does not expand env, so this cannot read
        # RIVET_PIN — bump it in tandem with RIVET_PIN above (one release,
        # two edits).
        uses: turinglambdaai/rivet/.github/actions/setup-embed-racket@5b1f3466a6030592d63cec2d7f17f33ac9e1a76a
      # Installed after the embeddable runtime so the catalog dependency
      # closure (cext-lib, crypto-lib, keel) resolves against the minimal
      # build — it ships no packages of its own.
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}'
        shell: bash
      - name: Install GTK toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libgtk-4-dev libjson-glib-dev libsecret-1-dev libglib2.0-dev
      - name: Toolchain doctor + build
        working-directory: payback
        run: |
          raco rivet doctor --json
          raco rivet build
      - name: Headless boot smoke
        working-directory: payback
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a ./.rivet/stage/RivetHost &
          APP_PID=$!
          sleep 8
          kill -0 $APP_PID
          kill $APP_PID

  windows-host:
    # The Windows host has no local compile path on the other platforms, so
    # without this job every UI change flew blind until a tag build — four
    # v1.8.0 release runs died here before this gate existed. Setup mirrors
    # the release windows job (setup-embed-racket's tar chokes on the
    # drive-letter colon of a windows runner).
    name: Windows host (WinUI3 build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.16
        with:
          architecture: x64
          version: stable
          distribution: full
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}'
        shell: bash
      - name: Build host
        # package, not build: `raco rivet build` compiles the Debug config,
        # whose CRT flavor has never matched the rivet static lib on Windows
        # (MTd vs MDd) — Release is the only configuration anyone builds,
        # and package compiles it (launch smoke skipped: no GUI session)
        shell: bash
        run: raco rivet package --skip-launch-smoke

  macos-host:
    name: macOS host build + package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: payback
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.16
        with:
          architecture: arm64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Build and package
        working-directory: payback
        run: |
          swift tests/macos-form-logic.swift
          raco test tests/
          raco rivet build
          raco rivet package
