# WinGet distribution.
#
# - Every published release opens a manifest-update PR on microsoft/winget-pkgs
#   automatically (winget-releaser, Komac underneath); merge it when the bot
#   checks turn green. The job skips quietly until the WINGET_TOKEN secret
#   exists (classic PAT with the public_repo scope).
# - The one-time "bootstrap" job opens the initial package PR from the
#   committed manifests in packaging/winget/: dispatch this workflow manually
#   once. It is idempotent - it exits early once the package exists upstream.
name: winget

on:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Update manifest on winget-pkgs
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Check for WINGET_TOKEN
        id: token
        run: echo "ok=${{ secrets.WINGET_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: vedantmgoyal9/winget-releaser@main
        if: steps.token.outputs.ok == 'true'
        with:
          identifier: TuringLambda.Payback
          installers-regex: '-windows-x64\.msi$'
          max-versions-to-keep: 5
          token: ${{ secrets.WINGET_TOKEN }}

  bootstrap:
    name: First-time package submission (run once)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Open first-submission PR on microsoft/winget-pkgs
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"
          PKG_DIR="$(find packaging/winget -mindepth 2 -maxdepth 2 -type d | head -1)"
          ID="$(basename "$(dirname "$PKG_DIR")")"
          VER="$(basename "$PKG_DIR")"
          BRANCH="$ID-$VER"

          if gh api "repos/microsoft/winget-pkgs/contents/manifests/t/TuringLambdaAI/$ID" > /dev/null 2>&1; then
            echo "Package $ID already exists on winget-pkgs - nothing to bootstrap."
            exit 0
          fi

          gh repo fork microsoft/winget-pkgs --clone=false > /dev/null
          gh repo sync "$OWNER/winget-pkgs" --source microsoft/winget-pkgs > /dev/null 2>&1 || true
          git clone --quiet --depth=1 "https://x-access-token:$WINGET_TOKEN@github.com/$OWNER/winget-pkgs.git" winget-pkgs
          cd winget-pkgs
          git config user.name "turinglambdaai"
          git config user.email "turinglambdaai@users.noreply.github.com"
          git remote add upstream https://github.com/microsoft/winget-pkgs.git
          git fetch --quiet --depth=1 upstream master
          git checkout --quiet -B "$BRANCH" FETCH_HEAD
          mkdir -p "manifests/t/TuringLambdaAI/$ID"
          cp -R "../$PKG_DIR" "manifests/t/TuringLambdaAI/$ID/$VER"
          git add "manifests/t/TuringLambdaAI/$ID/$VER"
          git commit --quiet -m "New package: $ID version $VER"
          git push --quiet --force "https://x-access-token:$WINGET_TOKEN@github.com/$OWNER/winget-pkgs.git" "HEAD:refs/heads/$BRANCH"
          gh pr create --repo microsoft/winget-pkgs \
            --base master --head "$OWNER:$BRANCH" \
            --title "New package: $ID version $VER" \
            --body "First submission of $ID version $VER. Source: https://github.com/${GITHUB_REPOSITORY} (manifests maintained in packaging/winget/, future versions submitted automatically on release)."
