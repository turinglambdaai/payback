name: Product Acceptance
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  RIVET_PIN: 5b1f3466a6030592d63cec2d7f17f33ac9e1a76a
jobs:
  windows:
    name: Windows packaged WinUI acceptance
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: Bogdanp/setup-racket@v1.16
        with: {version: '9.3', architecture: x64, distribution: full, variant: CS}
      - run: raco pkg install --auto --no-docs "https://github.com/turlamai/rivet.git#$env:RIVET_PIN"
        shell: pwsh
      - run: raco rivet acceptance --json
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: payback-acceptance-windows, path: .rivet/acceptance/, if-no-files-found: warn}
  macos:
    name: macOS packaged SwiftUI acceptance (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, arch: arm64}
          - {runner: macos-15-intel, arch: x64}
    steps:
      - uses: actions/checkout@v7
      - uses: Bogdanp/setup-racket@v1.16
        with: {version: '9.3', architecture: '${{ matrix.arch }}', distribution: full, variant: CS}
      - run: raco pkg install --auto --no-docs "https://github.com/turlamai/rivet.git#${RIVET_PIN}"
      - run: raco rivet acceptance --json
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: 'payback-acceptance-macos-${{ matrix.arch }}', path: .rivet/acceptance/, if-no-files-found: warn}
  linux:
    name: Linux packaged GTK4 acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: Bogdanp/setup-racket@v1.16
        with: {version: '9.3', architecture: x64, distribution: full, variant: CS}
      # --no-install-recommends: the recommends closure drags in speech
      # models (pocketsphinx, 27 MB) that once starved this job's whole
      # 50-minute budget on a slow mirror; retries ride out transient
      # mirror resets
      - run: sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=5 --no-install-recommends build-essential cmake ninja-build pkg-config libgtk-4-dev libjson-glib-dev libglib2.0-dev libsecret-1-dev liblz4-dev zlib1g-dev libncurses-dev libx11-dev libxtst-dev weston at-spi2-core python3-pyatspi
      - run: raco pkg install --auto --no-docs "https://github.com/turlamai/rivet.git#${RIVET_PIN}"
      - run: echo "FULL_RACKET_BIN=$(dirname "$(command -v raco)")" >> "$GITHUB_ENV"
      - uses: turlamai/rivet/.github/actions/setup-embed-racket@5b1f3466a6030592d63cec2d7f17f33ac9e1a76a
      - run: PATH="$FULL_RACKET_BIN:$PATH" dbus-run-session -- raco rivet acceptance --json
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: payback-acceptance-linux, path: .rivet/acceptance/, if-no-files-found: warn}
